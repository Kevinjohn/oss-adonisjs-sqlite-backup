name: release
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      actions: read
    steps:
      - name: Only main releases
        run: test "$GITHUB_REF" = "refs/heads/main" || { echo "release runs on main only"; exit 1; }
      - name: Verify checks for this commit
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! run_id=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow checks.yml --branch main --commit "$GITHUB_SHA" --limit 1 --json databaseId,headSha,event |
            jq -er --arg sha "$GITHUB_SHA" '.[0] | select(.headSha == $sha and (.event == "push" or .event == "workflow_dispatch")) | .databaseId | numbers'); then
            echo "Could not find checks.yml CI for main commit $GITHUB_SHA" >&2
            exit 1
          fi
          gh run watch "$run_id" --repo "$GITHUB_REPOSITORY" --interval 30 --exit-status
          if ! gh api "repos/$GITHUB_REPOSITORY/actions/runs/$run_id/jobs?filter=latest&per_page=100" |
            jq -e --argjson required '["checks"]' '.jobs as $jobs | all($required[]; . as $name | any($jobs[]; .name == $name and .status == "completed" and .conclusion == "success"))' >/dev/null; then
            echo "Could not verify every required check succeeded in CI run $run_id" >&2
            exit 1
          fi
  # Installing and building run dependency code, so they hold a read-only token.
  package:
    needs: ci
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      version: ${{ steps.check.outputs.version }}
      tarball: ${{ steps.check.outputs.tarball }}
    steps:
      - uses: actions/checkout@v7
        with: { fetch-depth: 0, persist-credentials: false }
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with: { node-version: 24, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - name: Release checks (tag, changelog, build, pack)
        id: check
        run: bash bin/release_check.sh
      - uses: actions/upload-artifact@v7
        with:
          name: release
          path: tmp/release/
          if-no-files-found: error
  # Only this job can write, and it runs no repository or dependency code.
  release:
    needs: package
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with: { name: release, path: tmp/release }
      - name: Create release
        env:
          GH_TOKEN: '${{ github.token }}'
          VERSION: '${{ needs.package.outputs.version }}'
          TARBALL: '${{ needs.package.outputs.tarball }}'
        run: gh release create "v$VERSION" "tmp/release/$TARBALL" --repo "$GITHUB_REPOSITORY" --prerelease --target "$GITHUB_SHA" --title "$VERSION" --notes-file tmp/release/notes.md
